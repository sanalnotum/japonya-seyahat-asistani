<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Japonya Seyahat Asistanı">
  <title>🇯🇵 Japonya Seyahat Asistanı</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 760px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 22px 18px 16px;
      text-align: center;
      background: linear-gradient(180deg, #fff 0%, #fff8f8 100%);
      border-bottom: 1px solid #eee;
    }

    .flag {
      font-size: 42px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .location-box {
      margin: 16px;
      padding: 15px;
      border-radius: 18px;
      background: #fafafa;
      border: 1px solid #eee;
    }

    .location-title {
      font-weight: 800;
      margin-bottom: 9px;
    }

    .location-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .location-buttons button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 9px 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .location-buttons button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .search {
      margin: 0 16px 18px;
    }

    .search input {
      width: 100%;
      padding: 15px 17px;
      border-radius: 16px;
      border: 1px solid #ddd;
      outline: none;
      background: #fafafa;
    }

    .search input:focus {
      border-color: #999;
      background: white;
    }

    .section-title {
      padding: 0 16px 10px;
      font-size: 19px;
      font-weight: 800;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 22px;
    }

    .category {
      border: 1px solid #eee;
      border-radius: 20px;
      background: white;
      padding: 18px 14px;
      min-height: 125px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      cursor: pointer;
      transition: transform .15s;
    }

    .category:active {
      transform: scale(.97);
    }

    .category-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .category-name {
      font-weight: 800;
      font-size: 16px;
    }

    .category-desc {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.4;
    }

    .cards {
      padding: 0 16px 30px;
    }

    .card {
      border: 1px solid #e8e8e8;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      background: white;
    }

    .card-visual {
      width: 100%;
      min-height: 120px;
      border-radius: 16px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .language {
      margin: 10px 0;
      padding: 12px;
      border-radius: 13px;
      background: #fafafa;
    }

    .language-label {
      font-size: 11px;
      color: #777;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .language-text {
      font-size: 18px;
      font-weight: 700;
    }

    .japanese {
      font-size: 24px;
      line-height: 1.5;
    }

    .reading {
      color: #555;
      font-size: 16px;
      font-style: italic;
    }

    .info {
      color: #555;
      line-height: 1.55;
      font-size: 14px;
    }

    .show-button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .back-button {
      margin: 16px;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #eee;
    }

    @media (min-width: 600px) {
      .categories {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="flag">🇯🇵</div>
    <h1>Japonya Seyahat Asistanı</h1>
    <div class="subtitle">
      Japonya'da ihtiyacın olduğunda yanında
    </div>
  </header>

  <section class="location-box">
    <div class="location-title">📍 Şu anda neredesin?</div>

    <div class="location-buttons">
      <button onclick="setLocation('Tokyo', this)">Tokyo</button>
      <button onclick="setLocation('Kyoto', this)">Kyoto</button>
      <button onclick="setLocation('Osaka', this)">Osaka</button>
      <button onclick="setLocation('Diğer', this)">Diğer</button>
    </div>
  </section>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="🔎 Ne arıyorsun? Örn: domuz, tren, otel..."
      oninput="searchCards()"
    >
  </div>

  <main id="mainContent">

    <div class="section-title">Seyahat Asistanı</div>

    <div class="categories">

      <button class="category" onclick="openCategory('airport')">
        <div class="category-icon">✈️</div>
        <div class="category-name">Havalimanı</div>
        <div class="category-desc">Check-in, bagaj, güvenlik, gate ve varış</div>
      </button>

      <button class="category" onclick="openCategory('flight')">
        <div class="category-icon">🛫</div>
        <div class="category-name">Uçak</div>
        <div class="category-desc">Uçakta kullanabileceğin ifadeler</div>
      </button>

      <button class="category" onclick="openCategory('transport')">
        <div class="category-icon">🚆</div>
        <div class="category-name">Ulaşım</div>
        <div class="category-desc">Tren, metro, otobüs ve taksi</div>
      </button>

      <button class="category" onclick="openCategory('places')">
        <div class="category-icon">🏯</div>
        <div class="category-name">Gezi & Tarih</div>
        <div class="category-desc">Ünlü yerler, tarih ve görülecekler</div>
      </button>

      <button class="category" onclick="openCategory('food')">
        <div class="category-icon">🍜</div>
        <div class="category-name">Yemek</div>
        <div class="category-desc">Japon yemekleri ve restoran ifadeleri</div>
      </button>

      <button class="category" onclick="openCategory('halal')">
        <div class="category-icon">☪️</div>
        <div class="category-name">Helal & İçerik</div>
        <div class="category-desc">Domuz, alkol ve içerik kontrolü</div>
      </button>

      <button class="category" onclick="openCategory('hotel')">
        <div class="category-icon">🏨</div>
        <div class="category-name">Otel</div>
        <div class="category-desc">Check-in, oda ve otel iletişimi</div>
      </button>

      <button class="category" onclick="openCategory('shopping')">
        <div class="category-icon">🛍️</div>
        <div class="category-name">Alışveriş</div>
        <div class="category-desc">Mağaza ve ödeme ifadeleri</div>
      </button>

      <button class="category" onclick="openCategory('money')">
        <div class="category-icon">💴</div>
        <div class="category-name">Para & Ödeme</div>
        <div class="category-desc">Yen, kart, ATM ve ödeme</div>
      </button>

      <button class="category" onclick="openCategory('phone')">
        <div class="category-icon">📱</div>
        <div class="category-name">Telefon & İnternet</div>
        <div class="category-desc">SIM, eSIM, Wi-Fi ve şarj</div>
      </button>

      <button class="category" onclick="openCategory('emergency')">
        <div class="category-icon">🚨</div>
        <div class="category-name">Acil Durum</div>
        <div class="category-desc">Yardım ve önemli ifadeler</div>
      </button>

      <button class="category" onclick="openCategory('communication')">
        <div class="category-icon">💬</div>
        <div class="category-name">İletişim</div>
        <div class="category-desc">Japonlarla günlük iletişim</div>
      </button>

    </div>

  </main>

  <footer>
    🇯🇵 Japonya Seyahat Asistanı<br>
    Türkçe • English • 日本語 • Latin okunuş
  </footer>

</div>

function setLocation(location, button) {
  currentLocation = location;

  document
    .querySelectorAll(".location-buttons button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  alert("Konum seçildi: " + location);
}

function openCategory(category) {
  const data = cards[category] || [];

  let html = `
    <button class="back-button" onclick="goHome()">← Ana sayfa</button>
    <div class="section-title">Kartlar</div>
    <div class="cards">
  `;

  data.forEach(card => {
    html += createCard(card);
  });

  html += `</div>`;

  document.getElementById("mainContent").innerHTML = html;
}

function createCard(card) {
  return `
    <article class="card">

      <div class="card-visual">${card.icon}</div>

      <h2>${card.title}</h2>

      <div class="language">
        <div class="language-label">Türkçe</div>
        <div class="language-text">${card.tr}</div>
      </div>

      <div class="language">
        <div class="language-label">English</div>
        <div class="language-text">${card.en}</div>
      </div>

      <div class="language">
        <div class="language-label">日本語</div>
        <div class="language-text japanese">${card.jp}</div>
      </div>

      <div class="language">
        <div class="language-label">Japonca okunuş</div>
        <div class="language-text reading">${card.reading}</div>
      </div>

      ${card.info ? `<div class="info">💡 ${card.info}</div>` : ""}

      <button class="show-button" onclick="showCard(this)">
        📱 Karşı tarafa göster
      </button>

    </article>
  `;
}

function showCard(button) {
  const card = button.closest(".card");
  card.requestFullscreen?.();
}

function goHome() {
  location.reload();
}

function searchCards() {
  const query = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  if (!query) {
    location.reload();
    return;
  }

  let results = [];

  Object.values(cards).forEach(category => {
    category.forEach(card => {
      const searchable = (
        card.title + " " +
        card.tr + " " +
        card.en + " " +
        card.jp + " " +
        card.reading + " " +
        (card.info || "")
      ).toLowerCase();

      if (searchable.includes(query)) {
        results.push(card);
      }
    });
  });

  let html = `
    <button class="back-button" onclick="goHome()">← Ana sayfa</button>
    <div class="section-title">Arama sonuçları</div>
    <div class="cards">
  `;

  if (results.length === 0) {
    html += `<div class="empty">😕 Aradığın şey henüz bulunamadı.</div>`;
  } else {
    results.forEach(card => {
      html += createCard(card);
    });
  }

  html += `</div>`;

  document.getElementById("mainContent").innerHTML = html;
}

</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .catch(error => console.error("Service Worker hatası:", error));
    });
  }
</script>
